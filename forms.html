    </div>

  <main id="main" class="main-content">

    <section class="hero">

      <div class="container hero__inner">

        <div class="hero__content">

          <p class="hero__title">
            Title Text
          </p>

          <h1>
            Heading Text
          </h1>

          <p>
            Paragraph Text
          </p>

        </div>

        <div class="hero__actions">

          <a class="button button-primary" href="#">
            Button
          </a>

          <a class="button button-secondary" href="#">
            Button
          </a>

        </div>

      </div>

    </section>

    <section class="form-shell">

      <div class="section-title">
        <h2>
          Form One
        </h2>
        <p>
          Paragraph text
        </p>
      </div>

      <div>

        <img class="form-brand" src="./icon.svg" alt="Brand logo" id="brand-logo">

        <hr class="form-divider">

        <form class="form" action="#" method="POST">
          <h1 class="form-title">Form Title</h1>

          <div class="form-field form-field--text">
            <label class="form-label" for="field-one">
              What is your primary preference?
            </label>
            <input class="form-input" type="text" name="field-one" id="field-one">
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--number">
            <label class="form-label" for="field-two">
              How many would you like?
            </label>
            <input class="form-input" type="number" name="field-two" id="field-two">
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--range">
            <label class="form-label" for="field-three">
              How would you like to set this?
            </label>

            <div class="range-group">
              <span class="range-label">Low</span>
              <input class="form-input form-input--range" type="range" name="field-three" id="field-three" value="3" min="1" max="5">
              <span class="range-label">High</span>
            </div>
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--checkbox">
            <span class="field-heading">Which options apply?</span>

            <div class="choice-group">
              <label class="choice-option" for="option-one">
                <input type="checkbox" name="option-group" id="option-one" value="option-one">
                <span>Option One</span>
              </label>

              <label class="choice-option" for="option-two">
                <input type="checkbox" name="option-group" id="option-two" value="option-two">
                <span>Option Two</span>
              </label>

              <label class="choice-option" for="option-three">
                <input type="checkbox" name="option-group" id="option-three" value="option-three">
                <span>Option Three</span>
              </label>
            </div>
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--radio">
            <span class="field-heading">Would you like to enable this feature?</span>

            <div class="choice-group">
              <label class="choice-option" for="yes-option">
                <input type="radio" name="feature-toggle" id="yes-option" value="yes">
                <span>Yes</span>
              </label>

              <label class="choice-option" for="no-option">
                <input type="radio" name="feature-toggle" id="no-option" value="no">
                <span>No</span>
              </label>
            </div>
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--select">
            <label class="form-label" for="field-four">
              What category best fits your needs?
            </label>

            <select class="form-select" name="field-four" id="field-four">
              <option value="category-one">Category One</option>
              <option value="category-two">Category Two</option>
              <option value="category-three">Category Three</option>
            </select>
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--datalist">
            <label class="form-label" for="field-five">
              What option would you prefer?
            </label>

            <input class="form-input" list="options" id="field-five" name="field-five">

            <datalist id="options">
              <option value="Option One"></option>
              <option value="Option Two"></option>
              <option value="Option Three"></option>
            </datalist>
          </div>

          <hr class="form-divider">

          <div class="form-field form-field--textarea">
            <label class="form-label" for="field-six">
              Add any additional notes or details.
            </label>
            <textarea class="form-textarea" id="field-six" name="field-six" rows="3" cols="40"></textarea>
          </div>

          <hr class="form-divider">

          <div class="form-actions">
            <!-- <input class="button button-primary" type="submit" value="Submit"> -->
            <a class="button button-primary" href="#">
              Submit
            </a>

          </div>

        </form>

      </div>

    </section>
